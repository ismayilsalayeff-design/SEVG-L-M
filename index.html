<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canımın içi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fffaf4; --blush:#fbe4e8; --rose:#e9a9b8; --deep:#b86b80; --ink:#8a4a5d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100svh; overflow-x:hidden; color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;
  background:
    radial-gradient(ellipse at 50% 40%, #fffdf9 0%, var(--cream) 45%, var(--blush) 100%);
}
/* soft moving light */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(circle at 20% 25%, rgba(255,255,255,.9), transparent 35%),
   radial-gradient(circle at 80% 75%, rgba(255,225,232,.8), transparent 40%);
  animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.12);opacity:.7}}

/* ---------- MAIN ---------- */
main{position:relative;z-index:5;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6vh 20px 110px}

/* ===== ŞƏKİL ÇƏRÇİVƏSİ ===== */
.frame{
  position:relative; width:min(66vw,340px); aspect-ratio:4/5;
  border-radius:200px 200px 28px 28px; padding:10px;
  background:linear-gradient(145deg,#fff,#fbe4e8 45%,#fff 70%,#f3cdd6);
  box-shadow:0 25px 60px rgba(184,107,128,.28), 0 0 0 1px rgba(255,255,255,.9) inset;
  opacity:0; animation:rise 2.4s 1.6s cubic-bezier(.2,.7,.2,1) forwards, float 7s 4s ease-in-out infinite;
  transition:transform .6s ease, box-shadow .6s ease;
}
.frame::before{ /* nazik xarici xətt */
  content:"";position:absolute;inset:-12px;border-radius:212px 212px 40px 40px;
  border:1px solid rgba(233,169,184,.7)}
.frame::after{ /* kiçik ürək bəzəyi */
  content:"♥";position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);
  width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  background:#fff;color:var(--rose);font-size:16px;box-shadow:0 4px 14px rgba(184,107,128,.3)}
.photo{position:relative;width:100%;height:100%;overflow:hidden;
  border-radius:190px 190px 20px 20px;background:linear-gradient(160deg,#fff4f6,#f8d9e0)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s ease}
.photo::after{ /* parıltı */
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform 1.2s ease}
.frame:hover{transform:translateY(-8px) rotate(-.8deg);box-shadow:0 35px 80px rgba(184,107,128,.38)}
.frame:hover .photo img{transform:scale(1.08)}
.frame:hover .photo::after{transform:translateX(120%)}
.placeholder{position:absolute;inset:0;display:none;place-items:center;text-align:center;
  font-style:italic;font-size:1.1rem;padding:20px;color:var(--deep)}
.placeholder b{display:block;font-size:3rem;color:var(--rose);font-weight:500}

/* ===== BAŞLIQ ===== */
h1{
  position:relative;margin-top:-34px;z-index:6;text-align:center;
  font-family:'Great Vibes',cursive;font-weight:400;line-height:1.15;
  font-size:clamp(3.6rem,15vw,7.5rem);
  background:linear-gradient(180deg,#c87a8f,#a85a70);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,255,255,.95)) drop-shadow(0 6px 14px rgba(184,107,128,.2));
  opacity:0;animation:fade 3.2s .3s ease forwards;
  padding:0 .15em;
}
.sub{margin-top:6px;font-style:italic;font-size:clamp(1rem,3.4vw,1.25rem);letter-spacing:.06em;
  opacity:0;animation:fade 3s 2.6s ease forwards;color:var(--deep)}
@keyframes fade{from{opacity:0;filter:blur(8px) drop-shadow(0 0 0 transparent);transform:translateY(10px)}
  to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
@keyframes float{50%{translate:0 -8px}}
h1{animation-name:titleIn}
@keyframes titleIn{from{opacity:0;transform:translateY(12px);letter-spacing:.08em}to{opacity:1;transform:none;letter-spacing:0}}

/* ===== GÜLLƏR ===== */
#flowers{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.fl{position:absolute;opacity:0;animation:bloom 3.5s ease forwards, sway 9s ease-in-out infinite;
  filter:drop-shadow(0 6px 8px rgba(184,107,128,.22))}
@keyframes bloom{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes sway{50%{transform:rotate(calc(var(--r) + 4deg))}}

/* ===== ƏLAVƏ ANİMASİYALAR ===== */
#floaters{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.fall{position:absolute;top:-8vh;opacity:0;animation:fall linear infinite}
.petal{width:14px;height:18px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#fff,#fbd9e0)}
.heart{color:#f2b5c3;font-size:14px}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}
  10%{opacity:.85}
  90%{opacity:.7}
  100%{opacity:0;transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}

/* ===== MUSİQİ PLEYERİ ===== */
.player{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px 8px 8px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:999px;
  box-shadow:0 10px 30px rgba(184,107,128,.25);
  opacity:0;animation:fade 2.5s 3s ease forwards;max-width:calc(100vw - 28px)}
.player button{width:44px;height:44px;flex:none;border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(145deg,#f4b9c7,#d98499);color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(184,107,128,.4);transition:transform .25s}
.player button:hover{transform:scale(1.08)}
.player button:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.player svg{width:18px;height:18px;fill:currentColor}
.player .pause{display:none}
.player.on .pause{display:block}.player.on .play{display:none}
.meta{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.meta span{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{font-size:.8rem;opacity:.75;display:flex;align-items:center;gap:6px;font-style:italic}
.note{width:13px;height:13px;fill:var(--rose)}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;margin-left:4px}
.eq i{width:3px;height:4px;background:var(--rose);border-radius:2px}
.player.on .eq i{animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{50%{height:14px}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .fall{display:none}
}
</style>
</head>
<body>

<div class="glow"></div>

<!-- Gül şəkilləri (SVG) – toxunmayın -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="pet" cx="50%" cy="80%" r="85%">
      <stop offset="0" stop-color="#fff2f4"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#f6e3e8"/>
    </radialGradient>
    <radialGradient id="pet2" cx="50%" cy="85%" r="80%">
      <stop offset="0" stop-color="#f9dfe5"/><stop offset=".6" stop-color="#fffafb"/><stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <radialGradient id="ctr" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c9"/><stop offset="1" stop-color="#e9c97a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9cfb2"/><stop offset="1" stop-color="#7ea282"/>
    </linearGradient>
    <g id="petals-a" fill="url(#pet)" stroke="#ecd0d7" stroke-width=".6">
      <ellipse cx="50" cy="25" rx="13" ry="25"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(45 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(90 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(135 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(225 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(270 50 50)"/>
      <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(315 50 50)"/>
    </g>
    <symbol id="flower" viewBox="0 0 100 100">
      <use href="#petals-a"/>
      <g fill="url(#pet2)" stroke="#efd5db" stroke-width=".5" transform="rotate(22.5 50 50) translate(50 50) scale(.72) translate(-50 -50)">
        <ellipse cx="50" cy="25" rx="13" ry="25"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(45 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(90 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(135 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(180 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(225 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(270 50 50)"/>
        <ellipse cx="50" cy="25" rx="13" ry="25" transform="rotate(315 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="9" fill="url(#ctr)"/>
      <g fill="#d9b25c"><circle cx="46" cy="47" r="1.2"/><circle cx="54" cy="46" r="1.2"/><circle cx="50" cy="54" r="1.2"/><circle cx="55" cy="52" r="1"/><circle cx="45" cy="53" r="1"/></g>
    </symbol>
    <symbol id="leafs" viewBox="0 0 100 100">
      <path d="M50 96C18 70 18 28 50 4c32 24 32 66 0 92z" fill="url(#leaf)" stroke="#6f9374" stroke-width=".8"/>
      <path d="M50 92V12" stroke="#6f9374" stroke-width=".8" fill="none"/>
    </symbol>
  </defs>
</svg>

<div id="flowers"></div>
<div id="floaters"></div>

<main>
  <!-- ======================================================
       ŞƏKİL BURADADIR  →  src="photo.jpg" hissəsini öz şəklinizlə dəyişin
       (photo.jpg faylı bu HTML ilə eyni qovluqda olmalıdır)
       ====================================================== -->
  <div class="frame">
    <div class="photo">
      <img src="can.JPG" alt="Sevgilim" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
      <div class="placeholder"><div><b>♥</b>photo.jpg faylını<br>buraya əlavə edin</div></div>
    </div>
  </div>

  <!-- ƏSAS YAZI – istəsəniz mətni dəyişə bilərsiniz -->
  <h1>Canımın içi</h1>
  <!-- KİÇİK ALT YAZI – istəsəniz dəyişin və ya silin -->
  <p class="sub">səni çox sevirəm</p>
</main>

<!-- ======================================================
     MUSİQİ: music.mp3 faylını bu HTML ilə eyni qovluğa qoyun.
     Başqa fayl istəyirsinizsə, aşağıdakı src="music.mp3" dəyərini dəyişin.
     ====================================================== -->
<audio id="bgm" src="Bora Duran - Döndüm.mp3" loop preload="auto"></audio>

<div class="player" id="player">
  <button id="toggle" aria-label="Oynat / Dayandır">
    <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="meta">
    <!-- MUSİQİNİN ADI – buranı öz mahnınızın adı ilə dəyişin -->
    <span id="title">Bizim mahnımız</span>
    <small>
      <svg class="note" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
      musiqi
      <span class="eq"><i></i><i></i><i></i></span>
    </small>
  </div>
</div>

<script>
/* ====== AYARLAR (istəsəniz dəyişin) ====== */
const FLOWER_COUNT = 1;      // 1 = standart sıxlıq, 1.4 = daha çox gül, 0.7 = daha az
const FALLING_COUNT = 14;    // düşən ləçək və ürəklərin sayı (az saxlamaq daha zərifdir)

/* ---------- Güllər ---------- */
(function(){
  const box = document.getElementById('flowers');
  const W = innerWidth, H = innerHeight, small = W < 600;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const unit = small ? 0.62 : 1;
  const items = [];

  // Künc dəstələri (böyük güllər) + kənar boyunca kiçik güllər
  const corners = [[0,0],[1,0],[0,1],[1,1]];
  corners.forEach(([cx,cy]) => {
    const n = Math.round((small ? 4 : 6) * FLOWER_COUNT);
    for(let i=0;i<n;i++){
      const size = (small ? 80 : 130) * (0.55 + rnd()*0.75);
      const spreadX = (small ? 0.2 : 0.17), spreadY = (small ? 0.16 : 0.24);
      const x = cx*W + (cx? -1:1) * rnd()*W*spreadX - size/2 + (cx? 24:-24)*unit;
      const y = cy*H + (cy? -1:1) * rnd()*H*spreadY - size/2 + (cy? 24:-24)*unit;
      items.push({x,y,size});
    }
  });
  const edge = Math.round((small ? 3 : 5) * FLOWER_COUNT);
  for(let i=1;i<=edge;i++){
    const t = (i + rnd()*.5) / (edge + 1);
    const s = (small ? 52 : 80) * (0.7 + rnd()*0.6);
    items.push({x:-s*0.45, y:H*t - s/2, size:s});
    items.push({x:W - s*0.55, y:H*(1 - t) - s/2, size:s});
    items.push({x:W*t - s/2, y:-s*0.45, size:s});
    items.push({x:W*(1 - t) - s/2, y:H - s*0.55, size:s});
  }

  items.forEach((it,i) => {
    const r = Math.round(rnd()*360);
    const delay = (1 + rnd()*5).toFixed(2);
    // yarpaqlar
    for(let k=0;k<2;k++){
      const ls = it.size*0.7, a = r + 40 + k*120 + rnd()*30;
      box.insertAdjacentHTML('beforeend',
        `<svg class="fl" style="--r:${a}deg;left:${it.x + it.size*0.15}px;top:${it.y + it.size*0.15}px;width:${ls}px;height:${ls}px;transform:rotate(${a}deg) translateY(${-it.size*0.45}px);animation-delay:${delay}s,${(rnd()*4).toFixed(1)}s"><use href="#leafs"/></svg>`);
    }
    box.insertAdjacentHTML('beforeend',
      `<svg class="fl" style="--r:${r}deg;left:${it.x}px;top:${it.y}px;width:${it.size}px;height:${it.size}px;transform:rotate(${r}deg);animation-delay:${(+delay+0.6).toFixed(2)}s,${(rnd()*4).toFixed(1)}s"><use href="#flower"/></svg>`);
  });
})();

/* ---------- Düşən ləçək və ürəklər ---------- */
(function(){
  const box = document.getElementById('floaters');
  for(let i=0;i<FALLING_COUNT;i++){
    const el = document.createElement('div');
    const isHeart = i % 4 === 0;
    el.className = 'fall ' + (isHeart ? 'heart' : 'petal');
    if(isHeart) el.textContent = '♥';
    el.style.left = (Math.random()*100) + 'vw';
    el.style.setProperty('--dx', (Math.random()*160 - 80) + 'px');
    el.style.setProperty('--rot', (Math.random()*540 - 270) + 'deg');
    el.style.animationDuration = (16 + Math.random()*14) + 's';
    el.style.animationDelay = (3 + Math.random()*20) + 's';
    el.style.scale = (0.7 + Math.random()*0.7);
    box.appendChild(el);
  }
})();

/* ---------- Musiqi ---------- */
(function(){
  const audio = document.getElementById('bgm');
  const player = document.getElementById('player');
  const btn = document.getElementById('toggle');
  audio.volume = 0.6;
  let userPaused = false;

  const sync = () => player.classList.toggle('on', !audio.paused);
  audio.addEventListener('play', sync);
  audio.addEventListener('pause', sync);

  btn.addEventListener('click', e => {
    e.stopPropagation();
    if(audio.paused){ userPaused = false; audio.play().catch(()=>{}); }
    else { userPaused = true; audio.pause(); }
  });

  // Avtomatik başlatma cəhdi
  audio.play().catch(() => {
    // Brauzer icazə vermədi → ilk toxunuşda başlat
    const start = () => { if(!userPaused) audio.play().catch(()=>{}); };
    ['pointerdown','keydown','touchstart'].forEach(ev =>
      addEventListener(ev, start, {once:true, passive:true}));
  });
})();
</script>
</body>
</html>
